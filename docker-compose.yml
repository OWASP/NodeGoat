
services:
  web:
    build: .
    env_file:
      - .env
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 512m
    cpus: 0.50
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/nodegoat
    command: sh -c "until nc -z -w 2 mongo 27017; do sleep 2; done; npm start"
    ports:
      - "127.0.0.1:4000:4000"

  mongo:
    image: mongo:4.4
    user: mongodb
    expose:
      - 27017
