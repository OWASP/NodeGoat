apiVersion: v1
kind: ServiceAccount
metadata:
  name: nodegoat-sa
  namespace: nodegoat
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nodegoat-readonly
  namespace: nodegoat
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nodegoat-readonly-binding
  namespace: nodegoat
subjects:
  - kind: ServiceAccount
    name: nodegoat-sa
    namespace: nodegoat
roleRef:
  kind: Role
  name: nodegoat-readonly
  apiGroup: rbac.authorization.k8s.io
